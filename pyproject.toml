[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mto-treasury"
description = "Municipal Treasury Office System"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]

[tool.setuptools]
py-modules = ["migration_manager", "database_hardening_tool", "mto_version"]

[tool.setuptools.dynamic]
version = { attr = "mto_version.PRODUCT_VERSION" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["api_clients*", "backend*", "clients*", "ui*", "utils*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Force test environment so production-only validators (non-root DB user,
# non-empty DB password) don't fire during the test suite.
# These same vars are set explicitly in .github/workflows/ci.yml.
env = [
    "MTO_ENVIRONMENT=test",
    "ENVIRONMENT=test",
]

[tool.black]
# Production and CI run Python 3.11. An explicit target keeps formatting
# deterministic as newer Black releases add parsers for later Python versions.
target-version = ["py311"]
# These legacy modules predate Black and would produce a very large
# formatting-only diff if touched. Keep the exemption narrow while their real
# runtime/static-analysis defects are repaired independently.
force-exclude = '''
(^|/)(clients/desktop/dashboard|ui/(analytics_dashboard|assessments|audit_trail|property|reports|system_admin)|backend/services/(job_service|verification_service))\.py$
'''
[tool.vercel]
entrypoint = "backend.main:app"
