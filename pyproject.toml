[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mto-treasury"
version = "1.0.0"
description = "Municipal Treasury Office System"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.2",
    "sqlalchemy==2.0.23",
    "pymysql==1.1.0",
    "python-dotenv==1.0.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "slowapi==0.1.8",
    "sentry-sdk[fastapi]==1.35.0",
    "python-multipart==0.0.6",
    "requests==2.31.0",
    "pandas==2.1.3",
    "openpyxl==3.1.2",
    "reportlab==4.0.7",
    "pillow==10.1.0",
    "alembic>=1.13.0"
]

[tool.setuptools]
py-modules = ["db_manager", "migration_manager", "receipt_generator", "theme_manager", "ui_components", "database_hardening_tool"]
packages = ["backend", "ui", "utils"]
