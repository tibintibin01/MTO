version: '3.8'

services:
  # MTO Backend API
  api:
    build: .
    container_name: mto-backend
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - PORT=8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  # Production-grade Database
  db:
    image: mariadb:10.11
    container_name: mto-mariadb
    # Bind to localhost only — never expose the DB port to the network directly.
    # Remove this ports block entirely in production; the api container reaches
    # the db container via the internal Docker network without port exposure.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MTO_DB_NAME:?MTO_DB_NAME is required}
      MARIADB_USER: ${MTO_DB_USER:?MTO_DB_USER is required}
      MARIADB_PASSWORD: ${MTO_DB_PASSWORD:?MTO_DB_PASSWORD is required}
    volumes:
      - mto_data:/var/lib/mysql
      # Mount the provisioning script so MariaDB runs it on first startup.
      # This upgrades the mto_app user grants to the full least-privilege set
      # (LOCK TABLES for mysqldump, CREATE/ALTER/DROP for Alembic migrations).
      # The script is only executed once — when the data volume is first initialised.
      - ./scripts/docker_init_db.sh:/docker-entrypoint-initdb.d/01_grant_app_user.sh:ro
    healthcheck:
      # Wait until MariaDB is accepting connections before the api container starts.
      # Uses the app credentials (not root) so the check also validates that the
      # mto_app account was provisioned correctly.
      test: ["CMD", "mariadb", "--user=${MTO_DB_USER}", "--password=${MTO_DB_PASSWORD}", "--execute=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # Metrics & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: mto-prometheus
    # Localhost-only — Prometheus should not be publicly accessible
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: mto-grafana
    # Localhost-only — expose via a reverse proxy with auth in production
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Disable anonymous access
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    restart: always

  # Redis for WebSocket Pub/Sub and rate limiter storage
  redis:
    image: redis:7-alpine
    container_name: mto-redis
    # Localhost-only — the api container reaches redis via internal Docker network
    ports:
      - "127.0.0.1:6379:6379"
    # Require password auth — passed via command so it's not in an env var
    # that could be leaked via `docker inspect`
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --bind 0.0.0.0
      --protected-mode no
    restart: always

volumes:
  mto_data:
