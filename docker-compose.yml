version: '3.8'

services:
  # MTO Backend API
  api:
    build: .
    container_name: mto-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db
    restart: always

  # Production-grade Database
  db:
    image: mariadb:10.11
    container_name: mto-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mto_secure_root}
      MARIADB_DATABASE: mto_treasury
      MARIADB_USER: mto_admin
      MARIADB_PASSWORD: ${DB_PASSWORD:-mto_pass_2024}
    volumes:
      - mto_data:/var/lib/mysql
    restart: always

  # Metrics & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: mto-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

volumes:
  mto_data:
