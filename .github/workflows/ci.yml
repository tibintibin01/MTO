name: MTO Treasury CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  dependency-portability:
    name: Dependency lock portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.lock
          dev-requirements.lock

    - name: Verify runtime lock can resolve
      run: python -m pip install --dry-run --require-hashes -r requirements.lock

    - name: Verify development lock can resolve
      run: python -m pip install --dry-run --require-hashes -r dev-requirements.lock

  quality-and-security:
    needs: dependency-portability
    runs-on: ubuntu-latest

    env:
      # Tell the app it is running in test mode so config.py does not enforce
      # production-only DB validation (MTO_DB_USER / MTO_DB_NAME required).
      # The integration tests use SQLite in-memory — no real DB is needed.
      MTO_ENVIRONMENT: test
      ENVIRONMENT: test
      # JWT secret must be set — secrets_manager.py now fails fast if missing.
      # Deterministic test-only key; production continues to require an
      # external high-entropy secret and never reads this CI environment.
      MTO_JWT_SECRET: ci_only_not_for_production_0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      # DB password can be empty in test mode (SQLite is used instead).
      MTO_DB_PASSWORD: ""
      # Suppress the MTO_API_KEY requirement for tests that don't use it.
      MTO_API_KEY: test_api_key_ci

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        # Black is enforced as a ratchet on changed Python files. Full history
        # is required so pull-request and multi-commit push ranges are reliable.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'dev-requirements.lock'

    - name: Install dependencies
      run: pip install --require-hashes -r dev-requirements.lock

    - name: 🔏 Verify dependency policy and lock integrity
      run: python -m scripts.check_dependency_policy

    - name: 🔐 Verify desktop/server trust boundary
      run: python scripts/verify_desktop_trust_boundary.py

    - name: 📏 Lint changed Python files with Black
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          diff_range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
        elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
          diff_range="${{ github.sha }}^...${{ github.sha }}"
        else
          diff_range="${{ github.event.before }}...${{ github.sha }}"
        fi

        mapfile -t python_files < <(
          git diff --name-only --diff-filter=ACMR "$diff_range" -- '*.py'
        )

        if (( ${#python_files[@]} == 0 )); then
          echo "No changed Python files to check."
          exit 0
        fi

        printf 'Checking %s\n' "${python_files[@]}"
        black --check -- "${python_files[@]}"

    - name: 🧼 Lint with Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 📐 Type check with Mypy
      # Incremental gate: these new compliance modules are type-clean. The
      # legacy backend baseline is recorded in docs/SECURITY_BASELINE.md.
      run: |
        mypy backend/services/compliance_impact_service.py \
          scripts/validate_compliance_v2_activation.py \
          --ignore-missing-imports --follow-imports=skip

    - name: 🛡️ Security scan with Bandit
      run: bandit -r backend/ -x ./venv,./tests --severity-level medium

    - name: 🔒 Audit dependencies for CVEs
      run: |
        pip-audit -r requirements.lock --progress-spinner off
        pip-audit -r dev-requirements.lock --progress-spinner off

    - name: 🧪 Run unit + integration + financial accuracy tests
      run: |
        pytest tests/ \
          --ignore=tests/test_ui_modules.py \
          --ignore=tests/load \
          -v \
          --cov=backend \
          --cov-report=xml \
          --cov-report=term-missing

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: 🔒 Audit frontend dependencies for CVEs
      run: npm audit --audit-level=moderate
      working-directory: frontend

    - name: 📏 Lint Next.js
      run: npm run lint
      working-directory: frontend

    - name: 🏗️ Build Next.js
      run: npm run build
      working-directory: frontend

