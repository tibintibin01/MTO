name: MTO Treasury CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r dev-requirements.txt

    - name: 📏 Lint with Black
      run: black --check .

    - name: 🧼 Lint with Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 📐 Type check with Mypy
      run: mypy backend/ --ignore-missing-imports

    - name: 🛡️ Security scan with Bandit
      run: bandit -r backend/ -x ./venv,./tests --severity-level medium

    - name: 🔒 Audit dependencies for CVEs
      run: pip-audit -r requirements.txt --format markdown

    - name: 🧪 Run Unit Tests
      env:
        MTO_JWT_SECRET: ${{ secrets.MTO_JWT_SECRET }}
        MTO_DB_PASSWORD: ${{ secrets.MTO_DB_PASSWORD }}
      run: |
        pytest tests/ --ignore=tests/test_ui_modules.py -v --cov=backend --cov-report=xml

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false
