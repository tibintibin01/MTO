name: MTO Treasury CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    env:
      # Tell the app it is running in test mode so config.py does not enforce
      # production-only DB validation (MTO_DB_USER / MTO_DB_NAME required).
      # The integration tests use SQLite in-memory — no real DB is needed.
      MTO_ENVIRONMENT: test
      ENVIRONMENT: test
      # JWT secret must be set — secrets_manager.py now fails fast if missing.
      MTO_JWT_SECRET: ${{ secrets.MTO_JWT_SECRET }}
      # DB password can be empty in test mode (SQLite is used instead).
      MTO_DB_PASSWORD: ""
      # Suppress the MTO_API_KEY requirement for tests that don't use it.
      MTO_API_KEY: test_api_key_ci

    steps:
    - uses: actions/checkout@v4
      with:
        # Black is enforced as a ratchet on changed Python files. Full history
        # is required so pull-request and multi-commit push ranges are reliable.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r dev-requirements.txt

    - name: 📏 Lint changed Python files with Black
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          diff_range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
        elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
          diff_range="${{ github.sha }}^...${{ github.sha }}"
        else
          diff_range="${{ github.event.before }}...${{ github.sha }}"
        fi

        mapfile -t python_files < <(
          git diff --name-only --diff-filter=ACMR "$diff_range" -- '*.py'
        )

        if (( ${#python_files[@]} == 0 )); then
          echo "No changed Python files to check."
          exit 0
        fi

        printf 'Checking %s\n' "${python_files[@]}"
        black --check -- "${python_files[@]}"

    - name: 🧼 Lint with Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 📐 Type check with Mypy
      run: mypy backend/ --ignore-missing-imports

    - name: 🛡️ Security scan with Bandit
      run: bandit -r backend/ -x ./venv,./tests --severity-level medium

    - name: 🔒 Audit dependencies for CVEs
      run: pip-audit -r requirements.txt --format markdown

    - name: 🧪 Run unit + integration + financial accuracy tests
      run: |
        pytest tests/ \
          --ignore=tests/test_ui_modules.py \
          --ignore=tests/load \
          -v \
          --cov=backend \
          --cov-report=xml \
          --cov-report=term-missing

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: 📏 Lint Next.js
      run: npm run lint
      working-directory: frontend

    - name: 🏗️ Build Next.js
      run: npm run build
      working-directory: frontend

