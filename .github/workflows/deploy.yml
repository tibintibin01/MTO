name: MTO Treasury Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build gate — full test suite must pass before any image is built
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      MTO_ENVIRONMENT: test
      ENVIRONMENT: test
      MTO_JWT_SECRET: ${{ secrets.MTO_JWT_SECRET }}
      MTO_DB_PASSWORD: ""
      MTO_API_KEY: test_api_key_ci

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r dev-requirements.txt

    - name: Run full test suite
      run: |
        pytest tests/ \
          --ignore=tests/test_ui_modules.py \
          --ignore=tests/load \
          -v

  # ---------------------------------------------------------------------------
  # 2. Build and push Docker image — SHA-tagged only, never :latest in prod
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push image
      id: meta
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        # Tag with the commit SHA only — :latest is intentionally omitted.
        # Using :latest in production makes rollbacks unreliable because
        # node restarts can silently pull a different image.
        tags: ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set image output
      run: echo "image=${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # 3. Image security scan — block deployment if HIGH/CRITICAL CVEs found
  # ---------------------------------------------------------------------------
  scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Scan image for CVEs with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        # Fail the pipeline if any HIGH or CRITICAL CVEs are found.
        # This catches vulnerabilities in the base image and OS packages
        # that pip-audit (which only scans Python packages) would miss.
        exit-code: '1'
        ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 4. Staging deployment — rolling update, then health check
  # ---------------------------------------------------------------------------
  staging:
    needs: scan
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate staging Kubernetes
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

    - name: Deploy to staging
      uses: azure/k8s-deploy@v4
      with:
        namespace: staging
        # Correct filename — k8s/deployment.yaml (not deployment-backend.yml)
        manifests: |
          k8s/deployment.yaml
          k8s/configmap.yaml
        images: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}

    - name: Wait for rollout to complete
      run: |
        kubectl rollout status deployment/mto-backend \
          --namespace staging \
          --timeout=120s

    - name: Verify staging health
      # Retry up to 10 times with 10s delay — allows time for readiness probe
      # to pass and the pod to start accepting traffic.
      run: |
        curl \
          --fail \
          --retry 10 \
          --retry-delay 10 \
          --retry-connrefused \
          https://staging-api.mto-municipal.gov/healthz

  # ---------------------------------------------------------------------------
  # 5. Production deployment — requires manual approval via GitHub environment
  # ---------------------------------------------------------------------------
  production:
    needs: staging
    runs-on: ubuntu-latest
    # The 'production' environment in GitHub settings should require a
    # manual approval from a designated reviewer before this job runs.
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate production Kubernetes
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.PROD_KUBECONFIG }}

    - name: Deploy to production
      uses: azure/k8s-deploy@v4
      with:
        namespace: production
        manifests: |
          k8s/deployment.yaml
          k8s/configmap.yaml
        images: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}

    - name: Wait for rollout to complete
      run: |
        kubectl rollout status deployment/mto-backend \
          --namespace production \
          --timeout=180s

    - name: Verify production health
      run: |
        curl \
          --fail \
          --retry 10 \
          --retry-delay 10 \
          --retry-connrefused \
          https://api.mto-municipal.gov/healthz

    - name: Tag release in registry
      # After a successful production deploy, also tag the image with the
      # git tag (e.g. v2.1.0) for human-readable rollback reference.
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        docker buildx imagetools create \
          --tag ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.ref_name }} \
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
