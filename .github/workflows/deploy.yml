name: MTO Treasury Deploy

on:
  push:
    tags: [ 'v*' ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build gate — full test suite must pass before any image is built
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      MTO_ENVIRONMENT: test
      ENVIRONMENT: test
      MTO_JWT_SECRET: ${{ secrets.MTO_JWT_SECRET }}
      MTO_DB_PASSWORD: ""
      MTO_API_KEY: test_api_key_ci

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Verify immutable semantic release tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
          echo "Production deployment requires an immutable Git tag." >&2
          exit 1
        fi
        if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must use semantic versioning (for example v2.2.0)." >&2
          exit 1
        fi
        git describe --tags --exact-match HEAD

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'dev-requirements.lock'

    - name: Install dependencies
      run: pip install --require-hashes -r dev-requirements.lock

    - name: Verify dependency policy and vulnerability status
      run: |
        python -m scripts.check_dependency_policy
        pip-audit -r requirements.lock --progress-spinner off
        pip-audit -r dev-requirements.lock --progress-spinner off

    - name: Run full test suite
      run: |
        pytest tests/ \
          --ignore=tests/test_ui_modules.py \
          --ignore=tests/load \
          -v

  # ---------------------------------------------------------------------------
  # 2. Build and push Docker image — SHA-tagged only, never :latest in prod
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push image
      id: meta
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        file: Dockerfile
        push: true
        # Tag with the commit SHA only — :latest is intentionally omitted.
        # Using :latest in production makes rollbacks unreliable because
        # node restarts can silently pull a different image.
        tags: ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set image output
      run: echo "image=${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # 3. Image security scan — block deployment if HIGH/CRITICAL CVEs found
  # ---------------------------------------------------------------------------
  scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Log in to registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Scan image for CVEs with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        # Fail the pipeline if any HIGH or CRITICAL CVEs are found.
        # This catches vulnerabilities in the base image and OS packages
        # that pip-audit (which only scans Python packages) would miss.
        exit-code: '1'
        ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 4. Staging deployment — rolling update, then health check
  # ---------------------------------------------------------------------------
  staging:
    needs: scan
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Authenticate staging Kubernetes
      uses: azure/k8s-set-context@38d6bc72e5877b8eb640e995218d42b8fedf1a47 # v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

    - name: Deploy to staging
      uses: azure/k8s-deploy@1082a9290dd683dfe1d60582f418a27684e3a391 # v4
      with:
        namespace: staging
        # Correct filename — k8s/deployment.yaml (not deployment-backend.yml)
        manifests: |
          k8s/deployment.yaml
          k8s/configmap.yaml
        images: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}

    - name: Wait for rollout to complete
      run: |
        kubectl rollout status deployment/mto-backend \
          --namespace staging \
          --timeout=120s

    - name: Verify staging health
      # Retry up to 10 times with 10s delay — allows time for readiness probe
      # to pass and the pod to start accepting traffic.
      run: |
        curl \
          --fail \
          --retry 10 \
          --retry-delay 10 \
          --retry-connrefused \
          https://staging-api.mto-municipal.gov/healthz

  # ---------------------------------------------------------------------------
  # 5. Production deployment — requires manual approval via GitHub environment
  # ---------------------------------------------------------------------------
  production:
    needs: staging
    runs-on: ubuntu-latest
    # The 'production' environment in GitHub settings should require a
    # manual approval from a designated reviewer before this job runs.
    environment: production

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Authenticate production Kubernetes
      uses: azure/k8s-set-context@38d6bc72e5877b8eb640e995218d42b8fedf1a47 # v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.PROD_KUBECONFIG }}

    - name: Deploy to production
      uses: azure/k8s-deploy@1082a9290dd683dfe1d60582f418a27684e3a391 # v4
      with:
        namespace: production
        manifests: |
          k8s/deployment.yaml
          k8s/configmap.yaml
        images: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}

    - name: Wait for rollout to complete
      run: |
        kubectl rollout status deployment/mto-backend \
          --namespace production \
          --timeout=180s

    - name: Verify production health
      run: |
        curl \
          --fail \
          --retry 10 \
          --retry-delay 10 \
          --retry-connrefused \
          https://api.mto-municipal.gov/healthz

    - name: Tag release in registry
      # After a successful production deploy, also tag the image with the
      # git tag (e.g. v2.1.0) for human-readable rollback reference.
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        docker buildx imagetools create \
          --tag ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.ref_name }} \
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
