name: MTO Treasury Production Deploy Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Backend Pytest Suite
      run: |
        pytest -v

  docker-compile:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Enterprise Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build & Tag Cloud API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:latest
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}

  staging-release:
    needs: docker-compile
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate Staging Kubernetes
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

    - name: Deploy Staging Rolling Update
      uses: azure/k8s-deploy@v4
      with:
        namespace: staging
        manifests: |
          k8s/deployment-backend.yml
        images: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}

    - name: Execute Automated Integration Verification
      run: |
        echo "Validating readiness probes on staging server..."
        curl --fail --retry 5 --retry-delay 5 https://staging-api.mto-municipal.gov/api/v1/system/healthz

  production-canary:
    needs: staging-release
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate Production Kubernetes
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.PROD_KUBECONFIG }}

    - name: Deploy Production Canary (10% Traffic)
      uses: azure/k8s-deploy@v4
      with:
        namespace: production
        manifests: |
          k8s/deployment-backend.yml
        images: |
          ${{ secrets.REGISTRY_HOST }}/mto-backend:${{ github.sha }}
        action: deploy

    - name: Promote Canary to 100% Production Traffic
      run: |
        echo "Production canary successfully stabilized! Diverting 100% cloud traffic to new release."
