# =============================================================================
# MTO Treasury System — nginx Reverse Proxy Configuration
# =============================================================================
# Place this file at /etc/nginx/sites-available/mto and symlink to
# /etc/nginx/sites-enabled/mto, then reload nginx.
#
# This config provides:
#   - Rate limiting (application-layer DDoS protection)
#   - Request size limits (prevents oversized payload attacks)
#   - Security headers (defence-in-depth alongside app-level headers)
#   - Separate upstream blocks for the API and the Next.js portal
#   - Static file caching
#
# Replace YOUR_DOMAIN with your actual domain or server IP.
# For HTTPS, uncomment the SSL section and point to your certificate files.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones
# ---------------------------------------------------------------------------
# Public portal search — 10 requests/minute per IP (matches app-level limit)
# Burst of 5 allows a quick sequence without immediately returning 429.
limit_req_zone $binary_remote_addr zone=public_search:10m rate=10r/m;

# Admin API — 60 requests/minute per IP (authenticated, higher allowance)
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=60r/m;

# Login endpoint — 5 attempts/minute per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Global fallback — 120 requests/minute per IP across all other paths
limit_req_zone $binary_remote_addr zone=global:10m rate=120r/m;

# ---------------------------------------------------------------------------
# Upstream servers
# ---------------------------------------------------------------------------
upstream mto_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream mto_portal {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (uncomment when SSL is configured)
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name YOUR_DOMAIN;
#     return 301 https://$host$request_uri;
# }

# ---------------------------------------------------------------------------
# Main server block
# ---------------------------------------------------------------------------
server {
    listen 80;
    # listen 443 ssl http2;          # Uncomment for HTTPS
    server_name YOUR_DOMAIN;

    # --- SSL (uncomment and configure when you have a certificate) ---
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # --- Request size limits ---
    # Reject bodies larger than 10 MB (Excel imports are the largest payload)
    client_max_body_size 10m;
    # Reject oversized headers (prevents header injection attacks)
    large_client_header_buffers 4 8k;

    # --- Timeouts ---
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          30s;

    # --- Security headers (complement app-level headers) ---
    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-Frame-Options         "DENY"                          always;
    add_header X-XSS-Protection        "0"                             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # Strict-Transport-Security — only add when HTTPS is active
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Hide nginx version from error pages ---
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Public portal search endpoints — tightest rate limits
    # ---------------------------------------------------------------------------
    location ~ ^/api/v1/public/ {
        limit_req zone=public_search burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://mto_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # Login endpoint — brute-force protection
    # ---------------------------------------------------------------------------
    location = /api/v1/api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://mto_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 15s;
    }

    # ---------------------------------------------------------------------------
    # All other API routes — admin/authenticated
    # ---------------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=admin_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://mto_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Longer timeout for backup/import operations
        proxy_read_timeout 600s;
    }

    # ---------------------------------------------------------------------------
    # Next.js public portal — global rate limit
    # ---------------------------------------------------------------------------
    location / {
        limit_req zone=global burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://mto_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # Static assets — long cache, no rate limiting needed
    # ---------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass       http://mto_portal;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------------------------------------------------------------------
    # Block common attack paths
    # ---------------------------------------------------------------------------
    # Reject requests for common vulnerability scanners and admin panels
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 444;  # Close connection without response
    }
    location ~* /(wp-admin|wp-login|phpmyadmin|adminer|\.env|\.git) {
        return 444;
    }

    # ---------------------------------------------------------------------------
    # Custom 429 error page
    # ---------------------------------------------------------------------------
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"code":"RATE_LIMITED","detail":"Too many requests. Please wait before trying again."}';
        add_header Content-Type application/json;
    }
}
