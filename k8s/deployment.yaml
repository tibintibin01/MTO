apiVersion: apps/v1
kind: Deployment
metadata:
  name: mto-backend
  labels:
    app: mto-treasury
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mto-treasury
  template:
    metadata:
      labels:
        app: mto-treasury
    spec:
      # ---------------------------------------------------------------------------
      # Init Container: Run Alembic migrations ONCE before any app pod starts.
      #
      # Without this, all 3 replicas race `alembic upgrade head` simultaneously
      # on rollout. Alembic is NOT concurrency-safe — concurrent runs can
      # deadlock or partially apply migrations, corrupting the schema.
      #
      # The initContainer runs to completion before any app container starts.
      # If it fails, the pod stays in Init:Error and no traffic is served.
      # ---------------------------------------------------------------------------
      initContainers:
      - name: run-migrations
        image: mto-treasury:__IMAGE_TAG__
        command: ["alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: mto-config
        - secretRef:
            name: mto-secrets
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"

      containers:
      - name: mto-backend
        # Pin to a specific digest in production — the CI pipeline substitutes
        # this with the SHA from the build step:
        #   image: registry/mto-backend@sha256:<digest>
        # Using :latest is intentionally avoided — it silently pulls a
        # different image on node restarts and makes rollbacks unreliable.
        image: mto-treasury:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http

        # Non-secret configuration from ConfigMap, and secrets from K8s Secret.
        # Create the secret before deploying:
        #   kubectl create secret generic mto-secrets \
        #     --from-literal=MTO_JWT_SECRET=<value> \
        #     --from-literal=MTO_DB_PASSWORD=<value> \
        #     --from-literal=GRAFANA_ADMIN_PASSWORD=<value> \
        #     --from-literal=REDIS_PASSWORD=<value>
        envFrom:
        - configMapRef:
            name: mto-config
        - secretRef:
            name: mto-secrets

        # Tell the app NOT to run migrations on startup — initContainer handles it
        env:
        - name: SKIP_MIGRATIONS
          value: "true"

        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"

        # Liveness probe — restarts the container only if the process itself
        # is deadlocked or unresponsive. Uses /readyz which is dependency-free
        # (no DB check) so a DB outage does NOT trigger a container restart —
        # it should trigger readiness failure instead, keeping the pod alive
        # to recover when the DB comes back.
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5

        # Readiness probe — gates traffic. K8s will not send requests to this
        # pod until /healthz returns 200. This prevents traffic from reaching
        # a pod that is still running migrations, warming up the DB pool, or
        # has lost its DB connection mid-deployment.
        # Uses a shorter period than liveness so traffic is restored quickly
        # after a transient DB blip.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mto-service
spec:
  selector:
    app: mto-treasury
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
      name: http
  type: LoadBalancer
